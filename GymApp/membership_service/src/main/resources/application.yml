server:
  port: 8082

gym-service:
  url: http://localhost:8081

member-service:
  url: http://localhost:8083

spring:
  application:
    name: membership-service

  datasource:
    url: jdbc:h2:mem:membership-db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console